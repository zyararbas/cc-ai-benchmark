[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-ai-benchmark"
version = "0.1.0"
description = "A public benchmark harness for evaluating AI systems on reproducible task suites."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aykut Yararbas" }]
keywords = ["benchmark", "evaluation", "ai", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
# Provider SDKs are optional: the harness core, its tests, and CI never need a
# key or a network. Install only the providers you intend to run.
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
openai = ["openai>=1.40"]
providers = ["anthropic>=0.40", "google-genai>=1.0", "openai>=1.40"]

[project.scripts]
cc-ai-benchmark = "cc_ai_benchmark.cli:main"

[project.urls]
Homepage = "https://github.com/zyararbas/cc-ai-benchmark"
Issues = "https://github.com/zyararbas/cc-ai-benchmark/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_ai_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
